---
name: Terraform CI

# All third-party actions are pinned to immutable commit SHAs
# (instead of floating tags) to protect against supply-chain attacks.
# The original version tag is kept as a trailing comment for readability.

on:
  push:
    branches: ["**"]
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
      - "tf.sh"
  pull_request:
    paths:
      - "**/*.tf"
      - ".github/workflows/terraform-ci.yml"
      - ".tflint.hcl"
      - "tf.sh"
  workflow_dispatch:

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Terraform fmt (format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.*"

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (syntax & consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.*"

      - name: Terraform init (no backend — validation only)
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate -no-color

  tflint:
    name: TFLint (best practices)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e87008f9dd1fe3e34e66aca6c97b4a69f72a7f4 # v4
        with:
          tflint_version: latest

      - name: Init TFLint plugins
        run: tflint --init

      - name: Run TFLint
        run: tflint --recursive --force --format compact

  trivy:
    name: Trivy (IaC security)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: "."
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@87ef0dc97def48aa960fbf026a2563ee9dbdb470 # v3
        with:
          sarif_file: trivy-results.sarif

  shellcheck:
    name: ShellCheck (tf.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: "."
          severity: warning

  gitleaks:
    name: Gitleaks (exposed secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The gitleaks-action wrapper requires a paid license on organization
      # repos, so the free OSS binary is installed directly instead.
      - name: Install Gitleaks (OSS binary, pinned)
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        # .gitleaks.toml allowlists the ${TAILSCALE_API_TOKEN} env reference
        # in tf.sh (declaration only, value comes from the OS environment).
        run: gitleaks detect --source . --config .gitleaks.toml --verbose --exit-code 1

  # NOTE: `terraform plan` is intentionally not run in CI — the libvirt
  # provider requires local KVM/QEMU (see README + tf.sh), which is
  # unavailable on GitHub-hosted runners. Syntax validation + TFLint +
  # Trivy cover everything that can be checked statically.
